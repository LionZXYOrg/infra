apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: test-kulikov-uk
  namespace: traefik
spec:
  secretName: test-kulikov-uk-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
  dnsNames:
    - kulikov.uk
    - "*.kulikov.uk"
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
