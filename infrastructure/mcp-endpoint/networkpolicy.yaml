apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-gateway-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: k3s-mcp
      app.kubernetes.io/name: kubernetes-mcp-server
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8443
