apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-gateway
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 256; }
    http {
      access_log off;
      client_body_temp_path /tmp/client;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      client_max_body_size 1m;
      client_header_timeout 10s;
      client_body_timeout 10s;
      map $http_origin $origin_allowed {
        default 0;
        "" 1;
        "https://${SERVER_IP}:8443" 1;
      }
      # Variable paths load renewed certificates for each TLS connection.
      map $ssl_server_name $tls_directory { default /etc/tls; }
      server {
        listen 8443 ssl;
        server_name ${SERVER_IP};
        ssl_certificate $tls_directory/tls.crt;
        ssl_certificate_key $tls_directory/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        if ($origin_allowed = 0) { return 403; }
        location = /healthz {
          proxy_pass http://127.0.0.1:8080/healthz;
        }
        location ~ ^/mcp/?$ {
          auth_basic "Home MCP";
          auth_basic_user_file /etc/auth/users;
          proxy_pass http://127.0.0.1:8080;
          proxy_http_version 1.1;
          proxy_set_header Host localhost;
          proxy_set_header Authorization "";
          proxy_set_header Origin "";
          proxy_set_header Connection "";
          proxy_buffering off;
          proxy_read_timeout 300s;
        }
        location / { return 404; }
      }
    }
