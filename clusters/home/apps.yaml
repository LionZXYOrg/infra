apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
  - name: infra-tls
  - name: cluster-secrets
  interval: 1m
  retryInterval: 30s
  timeout: 5m
  path: ./apps/demo
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
