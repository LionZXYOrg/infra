# Monitoring does not gate apps or depend on public DNS/certificates.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-monitoring
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./infrastructure/monitoring/stack
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
  - name: cluster-secrets
  deletionPolicy: Orphan
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: monitoring
    namespace: monitoring
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-config
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./infrastructure/monitoring/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
  - name: infra-monitoring
  wait: true
