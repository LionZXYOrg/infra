apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: telegram-bot-suite
  namespace: flux-system
spec:
  # Keep both this resource and the zero-replica Deployment inactive until cutover.
  suspend: true
  dependsOn:
    - name: infra-namespaces
    - name: cluster-secrets
  interval: 1m
  retryInterval: 30s
  timeout: 5m
  path: ./apps/telegram-bot-suite
  targetNamespace: acorn-care-bot
  prune: true
  deletionPolicy: Orphan
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
