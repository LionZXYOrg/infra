apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    labelSelector: app.kubernetes.io/part-of=flux
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: all-flux-controllers
    spec:
      template:
        spec:
          containers:
          - name: manager
            resources:
              requests:
                memory: null
              limits:
                memory: null
