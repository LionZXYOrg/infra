apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: acorn-care-bot
  namespace: flux-system
spec:
  # The pinned image is public. Stop the old reminder scheduler before activation.
  suspend: false
  dependsOn:
    - name: infra-namespaces
    - name: cluster-secrets
  interval: 1m
  retryInterval: 30s
  timeout: 5m
  path: ./apps/acorn-care-bot
  prune: true
  deletionPolicy: Orphan
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
