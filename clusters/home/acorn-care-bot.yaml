apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: acorn-care-bot
  namespace: flux-system
spec:
  # Keep disabled until the new token, private image access, and state cutover are ready.
  suspend: true
  dependsOn:
    - name: infra-namespaces
    - name: cluster-secrets
  interval: 1m
  retryInterval: 30s
  timeout: 5m
  path: ./apps/acorn-care-bot
  prune: true
  deletionPolicy: Orphan
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
