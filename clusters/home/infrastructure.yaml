apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./infrastructure/controllers
  prune: false
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: traefik
    namespace: traefik
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: cert-manager
    namespace: cert-manager
  dependsOn:
  - name: cluster-secrets
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-issuers
  namespace: flux-system
spec:
  dependsOn:
  - name: infra-controllers
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./infrastructure/issuers
  prune: false
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
  - apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    name: letsencrypt-staging
  - apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    name: letsencrypt-production
  healthCheckExprs:
  - apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    current: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-tls
  namespace: flux-system
spec:
  dependsOn:
  - name: infra-issuers
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./infrastructure/tls
  prune: false
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    name: test-kulikov-uk
    namespace: traefik
  healthCheckExprs:
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    current: "status.conditions.exists(c,\n  c.type == 'Ready' && c.status == 'True' &&\n  c.observedGeneration\
      \ == metadata.generation)"
