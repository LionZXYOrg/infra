apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: birthday-reminder
spec:
  releaseName: birthday-reminder
  interval: 10m
  timeout: 10m
  suspend: false
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: charts-app
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        type: deployment
        replicas: 1
        strategy: Recreate
        forceRename: birthday-reminder
        containers:
          bot:
            image:
              repository: ghcr.io/lionzxyorg/birthday-reminder
              tag: sha-c4b9b0a146b5fab4d5604d776fe66094fabb066f
              pullPolicy: IfNotPresent
              digest: sha256:364be80e80786ea7dc76ac5fb278135d4b57c833e8de6e980320065562f25caa
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - python
                    - -c
                    - import os; os.kill(1, 0)
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - python
                    - -c
                    - import os; os.kill(1, 0)
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - python
                    - -c
                    - import os; os.kill(1, 0)
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - NET_RAW
            command:
            - python
            - /app/telegram_bot.py
            env:
              TZ: Europe/Moscow
          cron:
            image:
              repository: ghcr.io/lionzxyorg/birthday-reminder
              tag: sha-c4b9b0a146b5fab4d5604d776fe66094fabb066f
              pullPolicy: IfNotPresent
              digest: sha256:364be80e80786ea7dc76ac5fb278135d4b57c833e8de6e980320065562f25caa
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - python
                    - -c
                    - import os; os.kill(1, 0)
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - python
                    - -c
                    - import os; os.kill(1, 0)
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - python
                    - -c
                    - import os; os.kill(1, 0)
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - NET_RAW
            command:
            - sh
            - -c
            - python /app/cron_builder.py > /var/spool/cron/crontabs/root && exec
              crond -f -l 2
            env:
              TZ: Europe/Moscow
    service: {}
    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: birthday-reminder-data
        advancedMounts:
          main:
            bot:
            - path: /app/birthday.csv
              subPath: birthday.csv
              readOnly: true
            cron:
            - path: /app/birthday.csv
              subPath: birthday.csv
              readOnly: true
      configuration:
        type: secret
        name: birthday-reminder-config
        defaultMode: 256
        advancedMounts:
          main:
            bot:
            - path: /app/secret.py
              subPath: bot-secret.py
              readOnly: true
            cron:
            - path: /app/secret.py
              subPath: cron-secret.py
              readOnly: true
