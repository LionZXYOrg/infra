apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: replacevowelbot
spec:
  releaseName: replacevowelbot
  interval: 10m
  timeout: 10m
  suspend: true
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: charts-app
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        type: deployment
        replicas: 1
        strategy: Recreate
        containers:
          main:
            image:
              repository: lionzxy/replace_vowel_bot
              tag: '2'
              digest: sha256:8a40541ff0256f06a4aaa027ee2c2331b500858d9b7edfa5f4a7013ce60b6b17
              pullPolicy: IfNotPresent
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 256Mi
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - /bin/sh
                    - -c
                    - kill -0 1
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - /bin/sh
                    - -c
                    - kill -0 1
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - /bin/sh
                    - -c
                    - kill -0 1
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
        forceRename: replacevowelbot
    persistence:
      secret:
        type: secret
        advancedMounts:
          main:
            main:
            - path: /app/secret.py
              subPath: secret.py
        name: replacevowelbot-config
        defaultMode: 256
