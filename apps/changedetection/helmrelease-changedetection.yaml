apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: changedetection
spec:
  releaseName: changedetection
  interval: 10m
  timeout: 10m
  suspend: true
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: charts-app
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        type: deployment
        replicas: 1
        strategy: Recreate
        containers:
          main:
            image:
              repository: ghcr.io/dgtlmoon/changedetection.io
              tag: 0.48.06
              digest: sha256:c67332c39ac8f5c12af68a6205461f7ab487352f4a3bcda8e6f4c17e6cf3f47a
              pullPolicy: IfNotPresent
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 256Mi
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: 5000
                    path: /
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: 5000
                    path: /
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: 5000
                    path: /
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
            env:
              PLAYWRIGHT_DRIVER_URL: ws://changedetection-browser:3000
            ports:
            - name: http
              containerPort: 5000
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
        forceRename: changedetection
      browser:
        type: deployment
        replicas: 1
        strategy: Recreate
        containers:
          main:
            image:
              repository: dgtlmoon/sockpuppetbrowser
              tag: latest
              digest: sha256:1d8f72d2ce2085faed4232e5ae1e65c02efe5b831a18e127829b267c260b4fb2
              pullPolicy: IfNotPresent
            resources:
              requests:
                cpu: 50m
                memory: 2Gi
              limits:
                memory: 2Gi
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
            env:
              SCREEN_WIDTH: '1920'
              SCREEN_HEIGHT: '1024'
              SCREEN_DEPTH: '16'
              MAX_CONCURRENT_CHROME_PROCESSES: '2'
            ports:
            - name: http
              containerPort: 3000
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add:
                - SYS_ADMIN
        forceRename: changedetection-browser
    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 5000
            targetPort: http
        forceRename: changedetection
      browser:
        controller: browser
        type: ClusterIP
        ports:
          http:
            port: 3000
            targetPort: http
        forceRename: changedetection-browser
    persistence:
      data:
        type: persistentVolumeClaim
        advancedMounts:
          main:
            main:
            - path: /datastore
        existingClaim: changedetection-data
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        advancedMounts:
          browser:
            main:
            - path: /dev/shm
