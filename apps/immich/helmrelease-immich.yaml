apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  releaseName: immich
  interval: 10m
  timeout: 10m
  suspend: false
  chart:
    spec:
      chart: immich
      version: 0.13.4
      sourceRef:
        kind: HelmRepository
        name: charts-immich
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        containers:
          main:
            env:
              DB_HOSTNAME: immich-postgres
              DB_USERNAME: postgres
              DB_DATABASE_NAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-config
                    key: DB_PASSWORD
              REDIS_HOSTNAME: immich-redis
              IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
    immich:
      persistence:
        library:
          existingClaim: immich-library
    valkey:
      enabled: false
    server:
      controllers:
        main:
          replicas: 1
          strategy: Recreate
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-server
                tag: v3.4.1
                digest: sha256:7c489add298fc2f92cda4c777de6462aa206877e04087b815f62c7664af0b53b
                pullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 50m
              probes:
                startup:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      port: 2283
                      path: /api/server/ping
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 30
                readiness:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      port: 2283
                      path: /api/server/ping
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 6
                liveness:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      port: 2283
                      path: /api/server/ping
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 6
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - NET_RAW
              ports:
              - name: http
                containerPort: 2283
    machine-learning:
      controllers:
        main:
          replicas: 1
          strategy: Recreate
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: v3.4.1
                digest: sha256:8adebf414256f6e4f837bfbb66fa94f14f4da7260e3a1d65cbba49e4e35d8764
                pullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 50m
              probes:
                startup:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      port: 3003
                      path: /ping
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 30
                readiness:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      port: 3003
                      path: /ping
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 6
                liveness:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      port: 3003
                      path: /ping
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 6
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - NET_RAW
              ports:
              - name: http
                containerPort: 3003
  dependsOn:
  - name: immich-backend
