apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  releaseName: immich
  interval: 10m
  timeout: 10m
  suspend: false
  chart:
    spec:
      chart: immich
      version: 0.13.4
      sourceRef:
        kind: HelmRepository
        name: charts-immich
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        containers:
          main:
            env:
              DB_HOSTNAME: immich-postgres
              DB_USERNAME: postgres
              DB_DATABASE_NAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-config
                    key: DB_PASSWORD
              REDIS_HOSTNAME: immich-redis
              IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
    immich:
      persistence:
        library:
          existingClaim: immich-library
    valkey:
      enabled: false
    server:
      controllers:
        main:
          replicas: 1
          strategy: Recreate
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-server
                tag: v3.3.5
                digest: sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6
                pullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 50m
                  memory: 2Gi
              probes:
                startup:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      port: 2283
                      path: /api/server/ping
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 30
                readiness:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      port: 2283
                      path: /api/server/ping
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 6
                liveness:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      port: 2283
                      path: /api/server/ping
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 6
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - NET_RAW
              ports:
              - name: http
                containerPort: 2283
    machine-learning:
      controllers:
        main:
          replicas: 1
          strategy: Recreate
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: v3.3.5
                digest: sha256:5b28c9352c8374b8a1ed96fbdd8d6755fea6e43510ec43fdf6538aa02ea40f56
                pullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 50m
                  memory: 2Gi
              probes:
                startup:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      port: 3003
                      path: /ping
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 30
                readiness:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      port: 3003
                      path: /ping
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 6
                liveness:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      port: 3003
                      path: /ping
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 6
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - NET_RAW
              ports:
              - name: http
                containerPort: 3003
  dependsOn:
  - name: immich-backend
