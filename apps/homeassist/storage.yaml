apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassist-config
  namespace: homeassist
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
