apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homeassist
spec:
  releaseName: homeassist
  interval: 10m
  timeout: 10m
  suspend: false
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: charts-app
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
    controllers:
      homeassistant:
        type: deployment
        replicas: 1
        strategy: Recreate
        forceRename: homeassist-homeassistant
        containers:
          main:
            image: &home-assistant-image
              repository: ghcr.io/home-assistant/home-assistant
              tag: 2026.10.2
              digest: sha256:33afb0659d786213264c2211f8d91c5fe87461c56eba6a3a546eb05fc71e89f4
              pullPolicy: IfNotPresent
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: 8123
                    path: /
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: 8123
                    path: /
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: 8123
                    path: /
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
            securityContext:
              privileged: true
            ports:
            - name: http
              containerPort: 8123
            env:
              TZ: Europe/London
        pod:
          nodeSelector:
            home.kulikov.uk/automation: 'true'
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
      matter-server:
        type: deployment
        replicas: 1
        strategy: Recreate
        forceRename: homeassist-matter-server
        containers:
          main:
            image: &matter-server-image
              repository: ghcr.io/matter-js/matterjs-server
              tag: 1.5.2
              digest: sha256:47bc4d8354baf4775c1daf87b02b61123b1b61feeb3b2eadb17c610dbbda9a1c
              pullPolicy: IfNotPresent
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - /usr/local/bin/healthcheck.sh
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - /usr/local/bin/healthcheck.sh
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - /usr/local/bin/healthcheck.sh
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
            ports:
            - name: http
              containerPort: 5580
            env:
              STORAGE_PATH: /data
              PRIMARY_INTERFACE: ens18
              LOG_LEVEL: info
        initContainers:
          network:
            image: *matter-server-image
            command:
            - /usr/bin/bash
            - /opt/matter-network/matter-network.sh
            args:
            - ens18
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
            securityContext:
              privileged: true
              runAsUser: 0
              runAsGroup: 0
        pod:
          nodeSelector:
            home.kulikov.uk/automation: 'true'
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
      matter-hub:
        type: deployment
        replicas: 1
        strategy: Recreate
        forceRename: homeassist-matter-hub
        containers:
          main:
            image:
              repository: ghcr.io/riddix/home-assistant-matter-hub
              tag: 2.0.59
              digest: sha256:ef997a84c088ac89e57f9cde0fb6fd18447da0a3c8cc9466c4232ba5a15bd9d7
              pullPolicy: IfNotPresent
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: 8482
                    path: /api/health/live
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: 8482
                    path: /api/health/live
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: 8482
                    path: /api/health/live
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - NET_RAW
            ports:
            - name: http
              containerPort: 8482
            env:
              HAMH_HOME_ASSISTANT_URL: http://homeassist-homeassistant:8123/
              HAMH_HOME_ASSISTANT_ACCESS_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: homeassist-config
                    key: HAMH_HOME_ASSISTANT_ACCESS_TOKEN
              HAMH_LOG_LEVEL: info
              HAMH_HTTP_PORT: '8482'
        pod:
          nodeSelector:
            home.kulikov.uk/automation: 'true'
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
      otbr:
        type: deployment
        replicas: 1
        strategy: Recreate
        forceRename: homeassist-otbr
        initContainers:
          network:
            image: *matter-server-image
            command:
            - /usr/bin/bash
            - /opt/matter-network/matter-network.sh
            args:
            - ens18
            - --router
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
            securityContext:
              privileged: true
              runAsUser: 0
              runAsGroup: 0
        containers:
          main:
            image:
              repository: openthread/border-router
              tag: latest
              digest: sha256:71e034ab10c001e1f6c5ef272116d0298f9c597cab2e354d340667313cdb2b6d
              pullPolicy: IfNotPresent
            command:
            - /usr/sbin/otbr-agent
            args:
            - -I
            - wpan0
            - -B
            - ens18
            - -d
            - '4'
            - -s
            - --auto-attach=0
            - --vendor-name
            - OpenThread
            - --model-name
            - BorderRouter
            - --data-path
            - /var/lib/thread
            - --rest-listen-address
            - 127.0.0.1
            - --rest-listen-port
            - '8081'
            - spinel+hdlc+uart:///dev/ttyACM0?uart-baudrate=460800&uart-flow-control&uart-exclusive
            - trel://ens18
            securityContext:
              privileged: true
              runAsUser: 0
              runAsGroup: 0
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [/usr/sbin/ot-ctl, state]
                  periodSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - /bin/bash
                    - -c
                    - 'case "$(/usr/sbin/ot-ctl state)" in *leader*|*router*|*child*) exit 0;; *) exit 1;; esac'
                  periodSeconds: 10
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [/usr/sbin/ot-ctl, state]
                  periodSeconds: 30
                  failureThreshold: 6
          restore:
            image: *home-assistant-image
            command: [python3, /opt/matter-network/restore-thread.py]
            env:
              PYTHONDONTWRITEBYTECODE: '1'
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [python3, /opt/matter-network/restore-thread.py, --ready]
                  periodSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [python3, /opt/matter-network/restore-thread.py, --ready]
                  periodSeconds: 10
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [python3, /opt/matter-network/restore-thread.py, --alive]
                  periodSeconds: 30
                  failureThreshold: 6
        pod:
          nodeSelector:
            home.kulikov.uk/automation: 'true'
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
    service:
      homeassistant:
        controller: homeassistant
        forceRename: homeassist-homeassistant
        type: ClusterIP
        ports:
          http:
            port: 8123
            targetPort: http
      matter-server:
        controller: matter-server
        forceRename: homeassist-matter-server
        type: ClusterIP
        ports:
          http:
            port: 5580
            targetPort: http
      matter-hub:
        controller: matter-hub
        forceRename: homeassist-matter-hub
        type: ClusterIP
        ports:
          http:
            port: 8482
            targetPort: http
    persistence:
      homeassistant:
        type: persistentVolumeClaim
        existingClaim: homeassist-config
        advancedMounts:
          homeassistant:
            main:
            - path: /config
          otbr:
            restore:
            - path: /restore/thread.datasets
              subPath: .storage/thread.datasets
              readOnly: true
      matter-server:
        type: persistentVolumeClaim
        existingClaim: homeassist-matter
        advancedMounts:
          matter-server:
            main:
            - path: /data
      matter-hub:
        type: persistentVolumeClaim
        existingClaim: homeassist-hub
        advancedMounts:
          matter-hub:
            main:
            - path: /data
      matter-network:
        type: configMap
        name: homeassist-matter-network
        advancedMounts:
          matter-server:
            network:
            - path: /opt/matter-network
              readOnly: true
          otbr:
            network:
            - path: /opt/matter-network
              readOnly: true
            restore:
            - path: /opt/matter-network
              readOnly: true
      otbr:
        type: persistentVolumeClaim
        existingClaim: homeassist-otbr
        advancedMounts:
          otbr:
            main:
            - path: /var/lib/thread
      thread-runtime:
        type: emptyDir
        advancedMounts:
          otbr:
            restore:
            - path: /tmp
      thread-tun:
        type: hostPath
        hostPath: /dev/net/tun
        hostPathType: CharDevice
        advancedMounts:
          otbr:
            main:
            - path: /dev/net/tun
      dbus:
        type: hostPath
        hostPath: /run/dbus
        hostPathType: Directory
        advancedMounts:
          homeassistant:
            main:
            - path: /run/dbus
              readOnly: true
          matter-server:
            main:
            - path: /run/dbus
              readOnly: true
      radio-0:
        type: hostPath
        hostPath: /dev/serial/by-id/usb-Nabu_Casa_ZBT-2_E072A1DAA2D4-if00
        hostPathType: CharDevice
        advancedMounts:
          otbr:
            main:
            - path: /dev/ttyACM0
      radio-1:
        type: hostPath
        hostPath: /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_501f34cba6a3ef118fdc44bd61ce3355-if00-port0
        hostPathType: CharDevice
        advancedMounts:
          homeassistant:
            main:
            - path: /dev/ttyUSB0
