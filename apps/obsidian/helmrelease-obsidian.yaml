apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: obsidian
spec:
  releaseName: obsidian
  interval: 10m
  timeout: 10m
  suspend: false
  chart:
    spec:
      chart: couchdb
      version: 4.6.3
      sourceRef:
        kind: HelmRepository
        name: charts-couchdb
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    clusterSize: 1
    erlangFlags:
      name: null
    createAdminSecret: false
    allowAdminParty: false
    extraSecretName: obsidian-config
    autoSetup:
      enabled: false
    networkPolicy:
      enabled: false
    serviceAccount:
      enabled: false
    image:
      repository: couchdb
      tag: 3.5.3@sha256:4e8e0a366208a87d5059b0f4fcbefff13c32401a655d4629c19be6288ea77675
    initImage:
      repository: busybox
      tag: 1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
    persistentVolume:
      enabled: false
    couchdbConfig:
      couchdb:
        single_node: 'true'
        max_document_size: '50000000'
        uuid: 0afbfbef23d4241573c29c761179c525
      chttpd:
        bind_address: any
        require_valid_user: 'true'
        enable_cors: 'true'
        max_http_request_size: '50000000'
      httpd:
        enable_cors: 'true'
      cors:
        origins: app://obsidian.md,capacitor://localhost,http://localhost
        credentials: 'true'
        methods: GET,PUT,POST,HEAD,DELETE
        headers: accept,authorization,content-type,origin,referer
    podSecurityContext:
      fsGroup: 5984
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
    resources:
      requests:
        cpu: 50m
        memory: null
    initResources:
      requests:
        cpu: 10m
        memory: null
    livenessProbe:
      enabled: true
      initialDelaySeconds: 60
    readinessProbe:
      enabled: true
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: StatefulSet
          name: obsidian-couchdb
        patch: "- op: add\n  path: /spec/template/spec/automountServiceAccountToken\n\
          \  value: false\n- op: replace\n  path: /spec/template/spec/volumes/2\n\
          \  value:\n    name: database-storage\n    persistentVolumeClaim:\n    \
          \  claimName: obsidian-data\n"
      - target:
          kind: ConfigMap
          name: obsidian-couchdb
        patch: "- op: replace\n  path: /data/seedlistinifile\n  value: |\n    [cluster]\n\
          \    seedlist ="
