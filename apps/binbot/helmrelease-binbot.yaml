apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: binbot
spec:
  releaseName: binbot
  interval: 10m
  timeout: 10m
  suspend: true
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: charts-app
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        type: deployment
        replicas: 1
        strategy: Recreate
        forceRename: binbot
        containers:
          main:
            image:
              repository: ghcr.io/lionzxyorg/binbot
              tag: live-20261013
              pullPolicy: IfNotPresent
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - python
                    - -c
                    - import os; os.kill(1, 0)
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - python
                    - -c
                    - import os; os.kill(1, 0)
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - python
                    - -c
                    - import os; os.kill(1, 0)
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - NET_RAW
            envFrom:
            - secretRef:
                name: binbot-config
            env:
              SUBSCRIBERS_FILE: /app/data/subscribers.json
              SCHEDULE_CACHE_FILE: /app/data/schedule_cache.json
    service: {}
    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: binbot-data
        advancedMounts:
          main:
            main:
            - path: /app/data
