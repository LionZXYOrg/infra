apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: localcontentshare
spec:
  releaseName: localcontentshare
  interval: 10m
  timeout: 10m
  suspend: true
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: charts-app
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        type: deployment
        replicas: 1
        strategy: Recreate
        containers:
          main:
            image:
              repository: tanq16/local-content-share
              tag: main
              digest: sha256:bad35d70ce8a831955960ff7a05d773c780ace6df6a8584fb23d241027b8691e
              pullPolicy: IfNotPresent
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: 8080
                    path: /
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: 8080
                    path: /
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: 8080
                    path: /
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
            ports:
            - name: http
              containerPort: 8080
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
        forceRename: localcontentshare
    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 8080
            targetPort: http
        forceRename: localcontentshare
    persistence:
      data:
        type: persistentVolumeClaim
        advancedMounts:
          main:
            main:
            - path: /app/data
        existingClaim: localcontentshare-data
