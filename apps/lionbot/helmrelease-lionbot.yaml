apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lionbot
spec:
  releaseName: lionbot
  interval: 10m
  timeout: 10m
  suspend: true
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: charts-app
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/arch: amd64
    controllers:
      main:
        type: deployment
        replicas: 1
        strategy: Recreate
        containers:
          main:
            image:
              repository: lionzxy/my-tg-bot
              tag: '3'
              digest: sha256:46fe8827c939f2aaf3f789e658bfbd146469d923f2e7b596d70f9e16badcf3d7
              pullPolicy: IfNotPresent
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 256Mi
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - /bin/sh
                    - -c
                    - kill -0 1
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - /bin/sh
                    - -c
                    - kill -0 1
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - /bin/sh
                    - -c
                    - kill -0 1
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            envFrom:
            - secretRef:
                name: lionbot-config
            env:
              SERVER_DATABASE_URL: jdbc:postgresql://lionbot-postgres:5432/postgres
        forceRename: lionbot
  dependsOn:
  - name: lionbot-db
