name: Secrets main audit

on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [master]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: secrets-main-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit private main metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: secrets-main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: LionZXYOrg/infra
          ref: master
          persist-credentials: false
          submodules: false
          sparse-checkout: scripts/secrets_main.py
          sparse-checkout-cone-mode: false
      - name: Publish the required Secrets main status
        env:
          GH_TOKEN: ${{ github.token }}
          SECRETS_MAIN_SSH_KEY: ${{ secrets.SECRETS_MAIN_SSH_KEY }}
        run: python3 scripts/secrets_main.py --publish
