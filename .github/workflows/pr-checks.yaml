name: PR checks

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install test dependencies and checksum-verified tools
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          python -m pip install -r requirements.txt
          bash scripts/install-tools.sh sops kubectl gitleaks helm
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Unit and regression tests
        run: python -m unittest discover -s tests -v
      - name: Public manifest and script validation
        run: bash scripts/check.sh
      - name: Render pinned migration charts and verify workload contracts
        run: python scripts/migration_check.py --render
      - name: Build snapshot-local application images without production credentials
        run: python scripts/migration_check.py --build-images
      - name: Smoke-test standalone LibreSpeed with no outbound network
        run: python tests/migrations/speedtest_smoke.py
      - name: Scan public history for credentials
        run: gitleaks git --redact=100 --log-opts=--all .

  deployment:
    name: Deployment
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Prepare disposable Ubuntu runner
        run: |
          sudo swapoff -a
          sudo apt-get update
          sudo apt-get install -y age
          python -m pip install -r requirements.txt
      - name: Fresh K3s, Flux, Helm, SOPS, and HTTPS deployment
        run: bash tests/ci/run.sh --disposable "$RUNNER_TEMP/infra-ci-report"
      - name: Save credential-free deployment report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/infra-ci-report
          retention-days: 7
          if-no-files-found: warn
